name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, llvm-tools-preview, rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: Check formatting
        run: npm run format:check

      - name: Lint JavaScript
        run: npm run lint

      - name: Lint Rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: npm run test:rust

      - name: Build native addon
        run: npm run build

      - name: Verify generated bindings
        run: npm run native:check

      - name: Test Node.js integration
        run: npm run test:node

      - name: Measure coverage
        run: npm run coverage

      - name: Validate package metadata
        run: npm run publint

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check generated files and whitespace
        run: |
          git diff --exit-code -- native.js native.d.ts
          git diff --check

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: target/coverage
          if-no-files-found: error

  node:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Install dependencies
        run: npm ci

      - name: Build native addon
        run: npm run build

      - name: Test Node.js integration
        run: npm run test:node

      - name: Test packed package
        if: matrix.node == 24
        run: npm run test:package

  platform:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-15-intel
            target: x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Build native addon
        run: npm run build -- --target ${{ matrix.target }}

      - name: Test native addon
        run: npm run test:node

      - name: Upload native addon
        uses: actions/upload-artifact@v7
        with:
          name: binding-${{ matrix.target }}
          path: avl-tree-rust.*.node
          if-no-files-found: error
