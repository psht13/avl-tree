name: Build Smart TV Remote v0.6.2

on:
  pull_request:
    branches: [main]
    paths:
      - ".bootstrap/v062/**"
      - ".github/workflows/build-smart-tv-remote-v062.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      APP_VERSION: "0.6.2"
      ANDROID_NDK_VERSION: "27.1.12297006"
      CGO_ENABLED: "0"

    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Reconstruct source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf smart-tv-remote
          mkdir -p smart-tv-remote
          for script in .bootstrap/v062/bootstrap-group-*.sh; do
            echo "Running ${script}"
            bash "${script}" smart-tv-remote
          done
          python3 - <<'PY'
          from pathlib import Path
          path = Path('smart-tv-remote/remoteapp/server.go')
          source = path.read_text(encoding='utf-8')
          if 'staticFS, err := fs.Sub(webFS, "web")' in source and 'mux.Handle("/assets/", http.FileServer(http.FS(staticFS)))' not in source:
              marker = '\tif err != nil {\n\t\tpanic(err)\n\t}\n'
              if marker not in source:
                  raise SystemExit('could not locate staticFS error block in server.go')
              source = source.replace(marker, marker + '\tmux.Handle("/assets/", http.FileServer(http.FS(staticFS)))\n', 1)
              path.write_text(source, encoding='utf-8')
          PY
          for path in \
            smart-tv-remote/go.mod \
            smart-tv-remote/remoteapp/google.go \
            smart-tv-remote/remoteapp/google_pairing.go \
            smart-tv-remote/remoteapp/samsung_apps.go \
            smart-tv-remote/remoteapp/web/index.html \
            smart-tv-remote/android/app/build.gradle; do
            if [[ ! -s "$path" ]]; then
              echo "Missing reconstructed file: $path"
              exit 1
            fi
          done
          grep -R 'appVersion.*0.6.2' smart-tv-remote/remoteapp/app.go
          grep -R 'versionName "0.6.2"' smart-tv-remote/android/app/build.gradle
          grep -F 'mux.Handle("/assets/", http.FileServer(http.FS(staticFS)))' smart-tv-remote/remoteapp/server.go
          find smart-tv-remote -type f | sort

      - name: Set up current stable Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install Android and protobuf tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler zip unzip file
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Generate Google TV protobuf bindings
        working-directory: smart-tv-remote
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p remoteapp/internal/googleproto
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/tronikos/androidtvremote2/70dc3e2791581873e5b1470cbe6d540f27537c9f/src/androidtvremote2/remotemessage.proto \
            -o remoteapp/internal/googleproto/remotemessage.proto
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd remoteapp/internal/googleproto
          protoc \
            --go_out=. \
            --go_opt=paths=source_relative \
            --go_opt=Mremotemessage.proto=smarttvremote/remoteapp/internal/googleproto \
            remotemessage.proto
          test -s remotemessage.pb.go

      - name: Resolve dependencies and validate code
        working-directory: smart-tv-remote
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          unformatted="$(gofmt -l $(find . -name '*.go' -type f))"
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
          CGO_ENABLED=1 go test -race ./...
          CGO_ENABLED=1 go vet ./...

      - name: Build Windows x64 EXE
        working-directory: smart-tv-remote
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../artifact
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w -H=windowsgui" \
            -o ../artifact/SmartTVRemote-v0.6.2-Windows-x64.exe \
            ./cmd/windows
          test -s ../artifact/SmartTVRemote-v0.6.2-Windows-x64.exe

      - name: Build Android bridge AAR
        working-directory: smart-tv-remote
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          mkdir -p android/app/libs
          gomobile bind \
            -target=android \
            -androidapi=23 \
            -javapkg=com.paul.remote \
            -o android/app/libs/mobilebridge.aar \
            ./mobilebridge
          test -s android/app/libs/mobilebridge.aar
          unzip -t android/app/libs/mobilebridge.aar

      - name: Build installable Android APK
        working-directory: smart-tv-remote/android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../artifact/SmartTVRemote-v0.6.2-debug.apk
          test -s ../../artifact/SmartTVRemote-v0.6.2-debug.apk

      - name: Validate binaries and package downloads
        shell: bash
        run: |
          set -euo pipefail
          file artifact/SmartTVRemote-v0.6.2-Windows-x64.exe | tee artifact/WINDOWS-FILE-TYPE.txt
          file artifact/SmartTVRemote-v0.6.2-debug.apk | tee artifact/APK-FILE-TYPE.txt
          unzip -t artifact/SmartTVRemote-v0.6.2-debug.apk
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner" verify --verbose --print-certs artifact/SmartTVRemote-v0.6.2-debug.apk | tee artifact/APK-SIGNATURE.txt
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt" dump badging artifact/SmartTVRemote-v0.6.2-debug.apk | tee artifact/APK-BADGING.txt
          grep -F "package: name='com.paul.smarttvremote' versionCode='8' versionName='0.6.2'" artifact/APK-BADGING.txt
          sha256sum \
            artifact/SmartTVRemote-v0.6.2-Windows-x64.exe \
            artifact/SmartTVRemote-v0.6.2-debug.apk \
            > artifact/SmartTVRemote-v0.6.2-SHA256.txt
          cp smart-tv-remote/README.md artifact/README.md
          cp smart-tv-remote/THIRD_PARTY_NOTICES.md artifact/THIRD_PARTY_NOTICES.md
          tar -cJf artifact/SmartTVRemote-v0.6.2-source.tar.xz -C smart-tv-remote .
          sha256sum artifact/SmartTVRemote-v0.6.2-source.tar.xz >> artifact/SmartTVRemote-v0.6.2-SHA256.txt
          cd artifact
          zip -9 SmartTVRemote-v0.6.2-Windows-x64.zip \
            SmartTVRemote-v0.6.2-Windows-x64.exe README.md THIRD_PARTY_NOTICES.md \
            SmartTVRemote-v0.6.2-SHA256.txt WINDOWS-FILE-TYPE.txt
          zip -9 SmartTVRemote-v0.6.2-Android.zip \
            SmartTVRemote-v0.6.2-debug.apk README.md THIRD_PARTY_NOTICES.md \
            SmartTVRemote-v0.6.2-SHA256.txt APK-FILE-TYPE.txt APK-SIGNATURE.txt APK-BADGING.txt
          unzip -t SmartTVRemote-v0.6.2-Windows-x64.zip
          unzip -t SmartTVRemote-v0.6.2-Android.zip

      - name: Upload APK, EXE and reports
        uses: actions/upload-artifact@v4
        with:
          name: SmartTVRemote-v0.6.2-builds
          path: artifact/*
          if-no-files-found: error
          retention-days: 7
